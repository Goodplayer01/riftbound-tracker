name: Probe matchup sources (temporary)
on:
  push:
    branches: [claude/project-thread-ssqyf8]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch pages
        shell: python
        run: |
          import re, json, urllib.request, collections
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA}), timeout=30).read().decode("utf-8", "replace")
          h = get("https://www.riftlite.com/community/matrix")
          pushes = re.findall(r'self\.__next_f\.push\(\[1,"((?:[^"\\]|\\.)*)"\]\)', h)
          print("PUSHES", len(pushes), [len(p) for p in pushes])
          payload = "".join(json.loads('"' + p + '"') for p in pushes)
          print("PAYLOAD", len(payload))
          i = payload.find('"deckSnapshot"')
          # walk back to the start of the enclosing record
          s = payload.rfind('{"', 0, i - 2000) if i > 2000 else 0
          print("BEFORE SNAPSHOT", payload[max(0, i - 2500):i])
          print("AFTER SNAPSHOT", payload[i:i + 1500])
          keys = collections.Counter(re.findall(r'"([A-Za-z_]{3,30})":', payload))
          print("KEYS", keys.most_common(120))
          for kw in ['"winner"', '"result"', '"outcome"', '"opponentLegend"', '"won"', '"playerLegend"', '"oppLegend"', '"season"', '"format"', '"mainDeck"', '"main"', '"sideboard"', '"createdAt"', '"playedAt"']:
              j = payload.find(kw); print("KW", kw, payload.count(kw), payload[max(0, j - 150):j + 250] if j >= 0 else "")
          lines = payload.split("\n"); print("LINES", len(lines), [ (l[:60], len(l)) for l in lines[:40] ])
          leg = get("https://www.riftlite.com/community/legends/Akali")
          print("LEGEND PAGE", len(leg), re.findall(r"<title>([^<]*)", leg)[:1])
          txt = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", re.sub(r"<script.*?</script>", "", leg, flags=re.S)))
          print("LEGEND TEXT", txt[:4000])
