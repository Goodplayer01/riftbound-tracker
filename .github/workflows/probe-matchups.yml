name: Probe matchup sources (temporary)
on:
  push:
    branches: [claude/project-thread-ssqyf8]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch pages
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for u in \
            "https://riftdecks.com/stats/winrate" \
            "https://riftdecks.com/stats/matchups-analysis" \
            "https://riftdecks.com/legends?metagame_id=5" \
            "https://www.riftlite.com/community/matrix" \
            "https://www.riftools.app/riftbound-winrates"; do
            echo "=================== $u"
            curl -sS -L -A "$UA" -o page.html -w "HTTP %{http_code} size %{size_download} type %{content_type}\n" "$u" || true
            echo "--- title"; grep -o '<title>[^<]*' page.html | head -2
            echo "--- script srcs"; grep -o '<script[^>]*src="[^"]*"' page.html | head -15
            echo "--- api/json hints"; grep -o -E '(/api/[A-Za-z0-9_/?=&.-]*|https?://[A-Za-z0-9.-]*/[A-Za-z0-9_/.-]*\.json|__NEXT_DATA__|data-[a-z-]*matchup[a-z-]*|winrate[A-Za-z_]*)' page.html | sort | uniq -c | sort -rn | head -25
            echo "--- Rengar context"; grep -o -E '.{0,160}Rengar.{0,200}' page.html | head -4
          done
