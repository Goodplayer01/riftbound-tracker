name: Probe matchup sources (temporary)
on:
  push:
    branches: [claude/project-thread-ssqyf8]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch pages
        shell: python
        run: |
          import re, urllib.request
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA}), timeout=20).read().decode("utf-8", "replace")
          print("ROBOTS", get("https://riftdecks.com/robots.txt")[:1500])
          h = get("https://riftdecks.com/stats/winrate")
          print("STATS LINKS", sorted(set(re.findall(r'href="(/stats/[^"]*)"', h)))[:40])
          print("METAGAME", re.findall(r'<option[^>]*value="(\d+)"[^>]*>([^<]{2,60})</option>', h)[:30])
          print("FORM", [m[:300] for m in re.findall(r'<form[^>]*>', h)][:5])
          tds = re.findall(r'<td[^>]*>.*?</td>', h, re.S)
          print("TD SAMPLES")
          for td in tds[30:36]: print(re.sub(r'\s+', ' ', td)[:900]); print('--')
          tr = re.findall(r'<tr[^>]*>.*?</tr>', h, re.S)
          print("ROWS", len(tr)); print(re.sub(r'\s+', ' ', tr[2])[:2500])
          print("FOOT", re.sub(r'\s+', ' ', h[h.find('</table>'):h.find('</table>')+1500]))
          for u in ["https://riftdecks.com/stats/winrate?metagame_id=5", "https://riftdecks.com/stats/cards", "https://riftdecks.com/stats"]:
              try:
                  x = get(u); print("OK", u, len(x), re.findall(r"<title>([^<]*)", x)[:1])
              except Exception as e: print("ERR", u, e)
