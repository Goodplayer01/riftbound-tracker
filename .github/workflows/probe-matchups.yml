name: Probe matchup sources (temporary)
on:
  push:
    branches: [claude/project-thread-ssqyf8]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Fetch pages
        shell: python
        run: |
          import re, urllib.request, time
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for u in ["https://riftdecks.com/stats/winrate", "https://riftdecks.com/stats/matchups-analysis",
                    "https://www.riftlite.com/community/matrix", "https://www.riftools.app/riftbound-winrates"]:
              print("=" * 20, u, flush=True)
              try:
                  t = time.time()
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA, "Accept": "text/html"}), timeout=20)
                  h = r.read().decode("utf-8", "replace")
                  print("HTTP", r.status, len(h), r.headers.get("content-type"), round(time.time() - t, 1), "s")
              except Exception as e:
                  print("ERR", repr(e)[:300]); continue
              print("title:", re.findall(r"<title>([^<]*)", h)[:1])
              print("scripts:", re.findall(r'<script[^>]*src="([^"]+)"', h)[:15])
              hints = set(re.findall(r'(/api/[\w/?=&.-]+|https?://[\w.-]+/[\w/.-]+\.json|__NEXT_DATA__|self\.__next_f)', h))
              print("hints:", sorted(hints)[:30])
              i = h.find("Akali")
              print("akali ctx:", h[max(0, i - 300):i + 500] if i >= 0 else None)
              print("table count:", h.count("<table"), "td count:", h.count("<td"))
