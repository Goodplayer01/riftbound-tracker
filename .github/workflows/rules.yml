name: Bake rules

# Refreshes public/rules.json (the "Da Rules" tab) from the official Core and Tournament
# Rules PDFs linked on playriftbound.com/en-us/rules-hub. Commits only when the rules text
# changed. Installed apps load it live from main, so no release is needed.
# Can also be started by hand from Actions > Bake rules > Run workflow.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bake-rules
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only pdfjs-dist is needed; skipping install scripts avoids the Electron download.
      - run: npm ci --ignore-scripts

      - run: node --experimental-strip-types scripts/check_rules.mjs

      - name: Bake rules.json
        run: node scripts/bake_rules.mjs

      - name: Commit rules
        run: |
          if git diff --quiet public/rules.json; then
            echo "No rule changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/rules.json
          git commit -m "Rules $(date -u +%F)"
          # main may have moved since checkout (daily prices); replay this commit on top.
          git pull --rebase
          git push
