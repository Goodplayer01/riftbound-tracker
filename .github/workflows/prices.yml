name: Bake prices

# Refreshes public/prices.json from Cardmarket every morning and adds the result
# to public/price-history.json (value chart and movers in the app). Installed apps
# pick both up at their next start, no release needed.
# Needs the repository secret TCG_CARDMARKET_API_KEY. Without it only the price
# history is updated from the prices.json already on main.
# Can also be started by hand from Actions > Bake prices > Run workflow.
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bake-prices
  cancel-in-progress: false

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bake prices.json
        env:
          TCG_CARDMARKET_API_KEY: ${{ secrets.TCG_CARDMARKET_API_KEY }}
        run: |
          if [ -z "$TCG_CARDMARKET_API_KEY" ]; then
            echo "::warning::Secret TCG_CARDMARKET_API_KEY not set, keeping the current prices.json"
          else
            python scripts/bake_prices.py
          fi

      - run: python scripts/bake_price_history.py

      - name: Commit prices
        run: |
          if git diff --quiet public/prices.json public/price-history.json; then
            echo "No price changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add public/prices.json public/price-history.json
          git commit -m "Prices $(date -u +%F)"
          # main may have moved since checkout; replay this commit on top instead of failing.
          git pull --rebase
          git push
