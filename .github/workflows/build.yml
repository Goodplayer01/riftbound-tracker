name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Electron binary is not needed for the type check and Vite build.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Type check and build
        run: npm run build
      - name: Syntax check Electron main process
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
