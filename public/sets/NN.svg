    <path d="M30 41.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9Z"/>
  </g>

  <!-- Moon -->
  <rect x="50" y="14" width="28" height="28" fill="#ffe7ad" mask="url(#crescent)"/>

  <!-- Nexus crystal -->
  <circle cx="48" cy="54" r="22" fill="url(#glow)"/>
  <path d="M48 32 60 54 48 76 36 54Z" fill="url(#gemR)"/>
  <path d="M48 32 48 76 36 54Z" fill="url(#gemL)"/>
  <path d="M48 32 54 54 48 76 42 54Z" fill="#fff" fill-opacity=".18"/>
