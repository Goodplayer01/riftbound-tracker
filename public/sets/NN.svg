<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">
  <defs>
    <radialGradient id="sky" cx="50%" cy="38%" r="65%">
      <stop offset="0" stop-color="#3b2a7a"/>
      <stop offset=".6" stop-color="#1b1442"/>
      <stop offset="1" stop-color="#0b0920"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe2a0"/>
      <stop offset=".5" stop-color="#e0a64a"/>
      <stop offset="1" stop-color="#8a5a1c"/>
    </linearGradient>
    <linearGradient id="gemL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b9f4ff"/>
      <stop offset="1" stop-color="#3fa9d9"/>
    </linearGradient>
    <linearGradient id="gemR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8f7bff"/>
      <stop offset="1" stop-color="#3a2a9e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7fe3ff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7fe3ff" stop-opacity="0"/>
    </radialGradient>
    <mask id="crescent">
      <circle cx="64" cy="27" r="11" fill="#fff"/>
      <circle cx="58.5" cy="23" r="10" fill="#000"/>
    </mask>
  </defs>

  <!-- Hex frame -->
  <path d="M48 4 86 26v44L48 92 10 70V26Z" fill="url(#rim)"/>
  <path d="M48 9.5 81.5 29v38L48 86.5 14.5 67V29Z" fill="url(#sky)"/>
  <path d="M48 9.5 81.5 29v38L48 86.5 14.5 67V29Z" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="1"/>

  <!-- Stars -->
  <g fill="#fff3d1">
